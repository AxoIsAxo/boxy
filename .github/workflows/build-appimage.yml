name: Build AppImage

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-appimage:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to attach the AppImage to a release on tag push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgdk-pixbuf-2.0-dev \
            librsvg2-dev \
            librsvg2-bin \
            gsettings-desktop-schemas \
            fonts-dejavu-core \
            appstream \
            binutils \
            pkg-config \
            fuse \
            xdg-utils

      - name: Get appimagetool
        run: |
          mkdir -p "$HOME/bin"
          # Use the maintained AppImage/appimagetool fork: its type-2 runtime mounts
          # via fusermount3 (libfuse3) and falls back cleanly, so the AppImage runs
          # on hosts where only libfuse3 (no classic `fusermount`) is installed.
          curl -fsSL -o "$HOME/bin/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$HOME/bin/appimagetool"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          appimagetool --version

      - name: Build AppImage
        run: bash build/build-appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Boxy-x86_64-AppImage
          path: build/Boxy-x86_64.AppImage
          if-no-files-found: error

      - name: Attach AppImage to release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Boxy-x86_64.AppImage
